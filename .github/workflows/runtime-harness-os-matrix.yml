name: Runtime Harness OS Matrix

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-harness-os-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-harness:
    name: Runtime Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Verify checked-out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "verified source SHA: $actual"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Validate machine-readable schemas
        run: python scripts/validation/validate_2_0_schemas.py

      - name: Run Runtime Harness validation tests
        run: python -m pytest -q tests/validation
