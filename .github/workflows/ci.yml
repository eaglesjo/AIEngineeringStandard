name: AI Engineering Standard CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-engineering-standard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gate:
    name: Repository validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run repository validation
        run: python scripts/validation/validate.py

      - name: Run installer lifecycle tests
        run: python scripts/installers/test_installers.py

      - name: Run validation test suite
        run: python -m pytest -q tests/validation

  source-integrity:
    name: Source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.source.outputs.sha }}"
          test "$actual" = "$expected"
          echo "verified source SHA: $actual"

  python-compatibility:
    name: Python compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tools
        run: python -m pip install --upgrade pip build pytest

      - name: Run repository validation tests
        run: |
          python scripts/validation/validate.py
          python -m pytest -q tests/validation

      - name: Build and smoke-test installable package
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m pip install dist/*.whl
          expected_version="$(cat VERSION)"
          test "$(ai-engineering-standard --version)" = "ai-engineering-standard ${expected_version}"
          target="$(mktemp -d)"
          ai-engineering-standard install --target "$target" --language en --domain common --policy overwrite
          ai-engineering-standard validate --target "$target"
          test -f "$target/AGENTS.md"
          test -f "$target/.codingstandard/installation.json"

  platform-installer:
    name: Installer compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Bash installer lifecycle tests
        if: runner.os != 'Windows'
        run: python scripts/installers/test_installers.py

      - name: Run Windows PowerShell installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installers/test_installers_windows.ps1

  package-distribution:
    name: Installable package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repository-gate
    steps:
      - name: Resolve source identity
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Test packaged CLI across locales and domains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install dist/*.whl
          expected_version="$(cat VERSION)"
          test "$(ai-engineering-standard --version)" = "ai-engineering-standard ${expected_version}"

          for locale in en ko; do
            for domain in common ml llm vision colab all; do
              target="/tmp/aes-consumer-${locale}-${domain}"
              echo "::group::Install ${locale}/${domain}"
              ai-engineering-standard install --target "${target}" --language "${locale}" --domain "${domain}" --policy overwrite
              ai-engineering-standard status --target "${target}" --json
              ai-engineering-standard validate --target "${target}"
              test -f "${target}/AGENTS.md"
              test -f "${target}/.codingstandard/installation.json"

              # Dry runs must leave the installed target untouched.
              before="$(find "${target}" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum)"
              ai-engineering-standard update --target "${target}" --policy overwrite --dry-run
              ai-engineering-standard uninstall --target "${target}" --dry-run
              after="$(find "${target}" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum)"
              test "${before}" = "${after}"

              # Uninstall should remove owned files and its manifest.
              ai-engineering-standard uninstall --target "${target}"
              test ! -e "${target}/.codingstandard/installation.json"
              test ! -e "${target}/AGENTS.md"
              echo "::endgroup::"
            done
          done
