name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Run full validation
        run: python scripts/validation/validate.py
      - name: Run installer lifecycle tests
        run: python scripts/installers/test_installers.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
