name: Publish AIEngineeringStandard package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat VERSION)"
          test "$tag" = "$version"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # publish_release.py is the single creator of the GitHub Release. The
      # tag push triggers this workflow before that script necessarily finishes,
      # so wait for the canonical release rather than racing to create it here.
      - name: Wait for canonical GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for attempt in {1..30}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              found=true
              break
            fi
            sleep 10
          done
          if [[ "$found" != "true" ]]; then
            echo "Timed out waiting for publish_release.py to create release $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Attach distribution artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
