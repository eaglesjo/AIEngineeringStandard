name: AIEngineeringStandard 2.0 Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_codex:
        description: "Install Codex CLI and run live runtime evidence scenarios (uses OPENAI_API_KEY secret)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUN_LIVE_CODEX: ${{ inputs.run_live_codex || false }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate 2.0 schemas
        run: python scripts/validation/validate_2_0_schemas.py

      - name: Run 2.0 conformance result semantic tests
        run: python tests/validation/test_validate_2_0_schemas.py

      - name: Run permission conformance policy tests
        run: python tests/validation/test_permission_conformance_policy.py

      - name: Validate portable Skills
        run: python scripts/validation/validate_portable_skill.py

      - name: Validate Codex runtime harness syntax
        run: python -m py_compile scripts/validation/run_runtime_conformance.py

      - name: Validate Codex adapter syntax
        run: python -m py_compile scripts/validation/adapters/codex_runtime.py

      - name: Run Codex JSONL parser edge-case tests
        run: python tests/validation/test_codex_jsonl_parser.py

      - name: Run Codex adapter self-test
        run: python tests/validation/test_codex_runtime_adapter.py

      - name: Run Codex adapter discovery
        run: python scripts/validation/adapters/codex_runtime.py --output /tmp/codex-runtime-adapter.json

      - name: Run Codex static conformance
        run: python scripts/validation/run_conformance.py --agent codex --check-only --output /tmp/codex-conformance.json

      - name: Validate Codex conformance fixture
        run: python scripts/validation/validate_conformance_fixture.py --agent codex --result /tmp/codex-conformance.json

      - name: Run runtime conformance harness dry run
        run: python scripts/validation/run_runtime_conformance.py --agent codex --output /tmp/codex-runtime-conformance.json

      - name: Run recovery conformance harness dry run
        run: python scripts/validation/run_runtime_conformance.py --agent codex --scenario tests/validation/fixtures/conformance/codex-runtime-failure-recovery.scenario.json --output /tmp/codex-runtime-recovery.json

      - name: Run Codex permission-denial scenario when runtime is available
        run: python scripts/validation/adapters/codex_runtime.py --scenario tests/validation/fixtures/conformance/codex-runtime-permission-denial.scenario.json --execute --output /tmp/codex-runtime-permission-denial.json

      - name: Install Codex CLI for live evidence
        if: env.RUN_LIVE_CODEX == 'true'
        run: npm install -g @openai/codex

      - name: Run live Codex runtime evidence scenarios
        if: env.RUN_LIVE_CODEX == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          codex --version
          python scripts/validation/adapters/codex_runtime.py --scenario tests/validation/fixtures/conformance/codex-runtime.scenario.json --execute --output /tmp/codex-live-runtime.json
          python scripts/validation/adapters/codex_runtime.py --scenario tests/validation/fixtures/conformance/codex-runtime-failure-recovery.scenario.json --execute --output /tmp/codex-live-recovery.json
          python scripts/validation/adapters/codex_runtime.py --scenario tests/validation/fixtures/conformance/codex-runtime-permission-denial.scenario.json --execute --output /tmp/codex-live-permission-denial.json

      - name: Publish conformance results
        uses: actions/upload-artifact@v4
        with:
          name: ai-engineering-standard-2.0-conformance
          path: |
            /tmp/codex-runtime-adapter.json
            /tmp/codex-conformance.json
            /tmp/codex-runtime-conformance.json
            /tmp/codex-runtime-recovery.json
            /tmp/codex-runtime-permission-denial.json
            /tmp/codex-live-runtime.json
            /tmp/codex-live-recovery.json
            /tmp/codex-live-permission-denial.json
          if-no-files-found: ignore
